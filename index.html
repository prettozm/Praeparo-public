        type: human
        name: Mainteneur
      roleId: v1-dev

      kind: analyse
      name: Analyse des risques données
      responsibility: "Identifier les scénarios de perte : interruption, double exécution, migration

      executor:
        type: human
        name: Mainteneur
      documents:
        - id: doc-data

      riskLevel: critical
      roleId: v1-dev

      kind: red_green
      name: Preuve Red → Green
      responsibility: "Pour toute correction : reproduire l'échec avant de démontrer le correctif."
      executor:
        type: automation
        name: Suite de tests
      evidence:
        - id: ev-rg
          description: Échec reproduit puis corrigé sur le scénario visé

      executor:

      evidence:
        - id: ev-panne-avant

          status: not_demonstrated

          kind: fault_injection
          status: not_demonstrated

          status: not_demonstrated

  name: Praeparo (ce dépôt)
  description: "Le workflow d'ingénierie du dépôt Praeparo : boucles courtes, preuves adaptées au
    risque, relecture indépendante sur les zones sensibles."
playbook:
  id: default
  name: Boucle de développement Praeparo
  seats:
    - id: besoin
      kind: besoin
      name: Comportement visé
      responsibility: Formuler en une phrase le comportement observable à construire ou corriger, et le
        risque particulier de la zone touchée.
      executor:
        type: human
        name: Yahya
      documents:
        - id: doc-cdc
          title: CDC Praeparo
          purpose: context
          location:
            kind: repo
            path: docs/product-vision.md
        - id: doc-state
          title: state.md
          purpose: input
          location:
            kind: repo
            path: docs/state.md
      roleId: product-owner
      assigneeId: m-yahya
    - id: impl
      kind: implementation
      name: Implémentation
      responsibility: Réaliser le plus petit changement cohérent qui ferme la boucle, sans élargir le
        périmètre par opportunisme.
      executor:
        type: agent
        name: Claude
        adapterHint: claude
        access: read_write
      documents:
        - id: doc-archi
          title: architecture.md
          purpose: rule
          location:
            kind: repo
            path: docs/architecture.md
        - id: doc-format
          title: format.md
          purpose: rule
          location:
            kind: repo
            path: docs/format.md
      roleId: maker
      assigneeId: m-claude
      guardrails:
        - "Point de vigilance connu : tendance à élargir le périmètre au-delà du nécessaire.
          Garde-fou : ne pas céder à cette tendance dans cette mission."
    - id: verif
      kind: test
      name: Vérification
      responsibility: Exécuter typecheck, tests unitaires et build ; pour une régression, préférer une
        preuve rouge → vert.
      executor:
        type: automation
        name: CI
        adapterHint: ci
      evidence:
        - id: ev-core
          description: Tests unitaires du Core (aller-retour YAML, validation, invariants)
          kind: test
          status: demonstrated
          limits: Couvre le Core et les modules d'état, pas l'ensemble des interactions UI.
        - id: ev-e2e
          description: Parcours E2E du Workshop (créer, configurer, recharger)
          kind: e2e
          status: demonstrated
          limits: Couvre le parcours nominal dans Chromium, pas les autres navigateurs.
      roleId: tests
      assigneeId: m-ci
    - id: revue
      kind: revue
      name: Revue indépendante
      responsibility: "Sur une zone à risque (persistance, format, modèle) : chercher à réfuter le
        changement dans un contexte neuf."
      executor:
        type: agent
        name: Checker
        adapterHint: claude
        access: read_only
        independentContext: true
      authority:
        canBlock: true
        description: Un REFUS renvoie vers l'implémentation.
      mandatory: false
      notes: Déclenchée pour les changements touchant le format canonique, la persistance ou le modèle.
      roleId: checker
      assigneeId: m-checker
    - id: validation
      kind: validation
      name: Revue produit
      responsibility: Vérifier que le résultat sert le produit décrit par le CDC, pas seulement qu'il fonctionne.
      executor:
        type: human
        name: Yahya
      authority:
        canBlock: true
        canApprove: true
      roleId: approver
      assigneeId: m-yahya
  transitions:
    - id: t1
      from: besoin
      to: impl
    - id: t2
      from: impl
      to: verif
    - id: t3
      from: verif
      to: revue
      condition: vérifications vertes
    - id: t4
      from: revue
      to: validation
      condition: verdict = PASS
    - id: t5
      from: revue
      to: impl
      label: REFUS
layout:
  positions:
    besoin:
      x: 0
      y: 80
    impl:
      x: 340
      y: 80
    verif:
      x: 700
      y: 80
    revue:
      x: 1090
      y: 80
    validation:
      x: 1500
      y: 80
  paths:
    t5:
      from: bottom
      to: top
