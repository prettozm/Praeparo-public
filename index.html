      roleId: v1-dev

      executor:

        - id: ev-rg

# Format ouvert, versionné et indépendant de l'interface (voir docs/format.md).
# La section "layout" ne porte que la disposition visuelle : la supprimer

version: 3
project:
  id: praeparo-repo
  name: Praeparo (ce dépôt)
  description: "Le workflow d'ingénierie du dépôt Praeparo : boucles courtes, preuves adaptées au
    risque, relecture indépendante sur les zones sensibles."
playbook:
  id: default
  name: Boucle de développement Praeparo
  seats:
    - id: besoin
      kind: besoin
      name: Comportement visé
      responsibility: Formuler en une phrase le comportement observable à construire ou corriger, et le
        risque particulier de la zone touchée.
      executor:
        type: human
        name: Yahya
      documents:
        - id: doc-cdc
          title: CDC Praeparo
          purpose: context
          location:
            kind: repo
            path: docs/product-vision.md
        - id: doc-state
          title: state.md
          purpose: input
          location:
            kind: repo
            path: docs/state.md
      roleId: product-owner
      assigneeId: m-yahya
    - id: impl
      kind: implementation
      name: Implémentation
      responsibility: Réaliser le plus petit changement cohérent qui ferme la boucle, sans élargir le
        périmètre par opportunisme.
      executor:
        type: agent
        name: Claude
        adapterHint: claude
        access: read_write
      documents:
        - id: doc-archi
          title: architecture.md
          purpose: rule
          location:
            kind: repo
            path: docs/architecture.md
        - id: doc-format
          title: format.md
          purpose: rule
          location:
            kind: repo
            path: docs/format.md
      roleId: maker
      assigneeId: m-claude
      guardrails:
        - "Point de vigilance connu : tendance à élargir le périmètre au-delà du nécessaire.
          Garde-fou : ne pas céder à cette tendance dans cette mission."
      acceptance:
        - npm run verify vert (typecheck + tests unitaires + build)
        - npm run test:e2e vert si le parcours utilisateur est touché
        - "mémoire du dépôt à jour : state.md, decisions.md, limitations.md"
      autonomy: autonomous
      humanGates:
        - rupture du format praeparo.yml publié
        - risque de perte ou corruption de données utilisateur
        - contradiction avec le CDC
        - choix de licence
        - choix produit sans critère de décision
      effort: high
    - id: verif
      kind: test
      name: Vérification
      responsibility: Exécuter typecheck, tests unitaires et build ; pour une régression, préférer une
        preuve rouge → vert.
      executor:
        type: automation
        name: CI
        adapterHint: ci
      evidence:
        - id: ev-core
          description: Tests unitaires du Core (aller-retour YAML, validation, invariants)
          kind: test
          limits: Couvre le Core et les modules d'état, pas l'ensemble des interactions UI.
        - id: ev-e2e
          description: Parcours E2E du Workshop (créer, configurer, recharger)
          kind: e2e
          limits: Couvre le parcours nominal dans Chromium, pas les autres navigateurs.
      roleId: tests
      assigneeId: m-ci
    - id: revue
      kind: revue
      name: Revue indépendante
      responsibility: "Sur une zone à risque (persistance, format, modèle) : chercher à réfuter le
        changement dans un contexte neuf."
      executor:
        type: agent
        name: Checker
        adapterHint: claude
        access: read_only
        independentContext: true
      authority:
        canBlock: true
        description: Un REFUS renvoie vers l'implémentation.
      mandatory: false
      requiredWhen: change.touchesFormat == true
      notes: Déclenchée pour les changements touchant le format canonique, la persistance ou le modèle.
      roleId: checker
      assigneeId: m-checker
      effort: high
    - id: validation
      kind: validation
      name: Revue produit
      responsibility: Vérifier que le résultat sert le produit décrit par le CDC, pas seulement qu'il fonctionne.
      executor:
        type: human
        name: Yahya
      authority:
        canBlock: true
        canApprove: true
      roleId: approver
      assigneeId: m-yahya
      autonomy: forbidden
  transitions:
    - id: t1
      from: besoin
      to: impl
    - id: t2
      from: impl
      to: verif
    - id: t3
      from: verif
      to: revue
      condition: vérifications vertes
    - id: t4
      from: revue
      to: validation
      condition: verdict = PASS
    - id: t5
      from: revue
      to: impl
      label: REFUS
      condition: review.verdict == fail
      loop:
        maxIterations: 3
        onExhausted:
          kind: human
  revision: 1

  positions:
    besoin:
      x: 0
      y: 80
    impl:
      x: 340

      x: 700

      x: 1090

    validation:
      x: 1500

  paths:
    t5:
      from: bottom
      to: top
