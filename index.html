  id: default
  name: De la contribution à la release
  seats:
    - id: besoin
      kind: besoin
      name: Issue / proposition
      responsibility: Décrire le problème ou l'amélioration, et son impact sur l'API publique.
      executor:
        type: human
        name: Contributeur
      documents:
        - id: doc-contrib
          title: CONTRIBUTING.md
          purpose: rule
          location:
            kind: repo
            path: CONTRIBUTING.md
      roleId: v1-dev
    - id: impl
      kind: implementation
      name: Implémentation
      responsibility: Réaliser le changement sans casser l'API publique documentée.
      executor:
        type: human
        name: Contributeur
        access: read_write
      roleId: v1-dev
    - id: tests
      kind: test
      name: Tests
      responsibility: Démontrer le comportement ajouté et l'absence de régression sur l'API.
      executor:
        type: automation
        name: CI
      evidence:
        - id: ev-unit
          description: Tests unitaires du changement
          kind: test
          status: not_demonstrated
        - id: ev-compat
          description: Suite de compatibilité de l'API publique
          kind: test
          status: not_demonstrated
          limits: Ne couvre que l'API documentée, pas les usages internes des dépendants.
      roleId: v1-dev
    - id: revue
      kind: revue
      name: Revue mainteneur
      responsibility: Vérifier la cohérence avec la direction du projet et la qualité du changement.
      executor:
        type: human
        name: Mainteneur
        access: read_only
      authority:
        canBlock: true
        canApprove: true
        description: Seul le mainteneur merge.
      roleId: v1-mainteneur
    - id: release
      kind: publication
      name: Release
      responsibility: Publier une version versionnée avec changelog.
      executor:
        type: automation
        name: CI de release
      documents:
        - id: doc-changelog
          title: CHANGELOG.md
          purpose: output
          location:
            kind: repo
            path: CHANGELOG.md
      riskLevel: high
      roleId: v1-mainteneur
  transitions:
    - id: t1
      from: besoin
      to: impl
    - id: t2
      from: impl
      to: tests
    - id: t3
      from: tests
      to: revue
      condition: tests verts
    - id: t4
      from: revue
      to: release
      condition: approbation du mainteneur

playbook:
  id: default
  name: Changement touchant les données
  seats:
    - id: besoin
      kind: besoin
      name: Besoin
      responsibility: Décrire le changement et dire explicitement s'il touche les données persistées.
      executor:
        type: human
        name: Mainteneur
      roleId: v1-dev
    - id: analyse
      kind: analyse
      name: Analyse des risques données
      responsibility: "Identifier les scénarios de perte : interruption, double exécution, migration
        partielle, crash."
      executor:
        type: human
        name: Mainteneur
      documents:
        - id: doc-data
          title: data-model.md
          purpose: rule
          location:
            kind: repo
            path: docs/data-model.md
      riskLevel: critical
      roleId: v1-data
    - id: impl
      kind: implementation
      name: Implémentation
      responsibility: Réaliser le changement avec une stratégie de migration réversible quand c'est possible.
      executor:
        type: agent
        name: Claude
        adapterHint: claude
        access: read_write
      riskLevel: critical
      roleId: v1-dev
    - id: redgreen
      kind: red_green
      name: Preuve Red → Green
      responsibility: "Pour toute correction : reproduire l'échec avant de démontrer le correctif."
      executor:
        type: automation
        name: Suite de tests
      evidence:
        - id: ev-rg
          description: Échec reproduit puis corrigé sur le scénario visé
          kind: red_green
          status: not_demonstrated
          limits: Prouve le scénario testé, pas l'ensemble de la promesse.
      roleId: v1-qa
    - id: panne
      kind: test
      name: Injection de panne
      responsibility: Vérifier qu'une interruption pendant l'écriture ne corrompt pas les données existantes.
      executor:
        type: automation
        name: Suite de tests
      evidence:
        - id: ev-panne-avant
          description: Interruption avant écriture
          kind: fault_injection
          status: not_demonstrated
        - id: ev-panne-pendant
          description: Interruption pendant écriture
          kind: fault_injection
          status: not_demonstrated
        - id: ev-reprise
          description: Reprise après crash au démarrage suivant
          kind: fault_injection
          status: not_demonstrated
      riskLevel: critical
      roleId: v1-qa
    - id: revue
      kind: revue
      name: Revue indépendante
      responsibility: "Réfuter la promesse « aucune perte de données » : chercher le scénario manquant."

        type: agent
        name: Checker

        independentContext: true

        canApprove: true

      assigneeId: m-yahya
    - id: impl
      kind: implementation
      name: Implémentation
      responsibility: Réaliser le plus petit changement cohérent qui ferme la boucle, sans élargir le
        périmètre par opportunisme.
      executor:
        type: agent
        name: Claude
        adapterHint: claude
        access: read_write

        - id: doc-archi

          location:
            kind: repo
            path: docs/format.md

        - "Point de vigilance connu : tendance à élargir le périmètre au-delà du nécessaire.

      kind: test
      name: Vérification

        type: automation

        adapterHint: ci

      assigneeId: m-ci

        canBlock: true
        canApprove: true

      from: impl
      to: verif
    - id: t3
      from: verif

    - id: t4
      from: revue
      to: validation
      condition: verdict = PASS
    - id: t5
      from: revue
      to: impl
      label: REFUS
