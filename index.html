`,Ab=`# Exemple B — bibliothèque open source : qualité de release et compatibilité d'API d'abord.
version: 1
project:
  id: exemple-b-oss
  name: "Exemple B — Bibliothèque open source"
  description: "Une librairie publiée : les releases et la stabilité de l'API comptent plus que la vitesse."
workflow:
  id: default
  name: De la contribution à la release
  roles:
    - id: dev
      name: Contributeur
      family: dev
    - id: mainteneur
      name: Mainteneur
      family: dev
  steps:
    - id: besoin
      kind: besoin
      name: Issue / proposition
      responsibility: "Décrire le problème ou l'amélioration, et son impact sur l'API publique."
      role: dev
      executor: { type: human, name: Contributeur }
      documents:
        - id: doc-contrib
          title: CONTRIBUTING.md
          purpose: rule
          location: { kind: repo, path: CONTRIBUTING.md }
    - id: impl
      kind: implementation
      name: Implémentation
      responsibility: "Réaliser le changement sans casser l'API publique documentée."
      role: dev
      executor: { type: human, name: Contributeur, access: read_write }
    - id: tests
      kind: test
      name: Tests
      responsibility: "Démontrer le comportement ajouté et l'absence de régression sur l'API."
      role: dev
      executor: { type: automation, name: CI }
      evidence:
        - id: ev-unit
          description: Tests unitaires du changement
          kind: test
          status: not_demonstrated
        - id: ev-compat
          description: Suite de compatibilité de l'API publique
          kind: test
          status: not_demonstrated
          limits: "Ne couvre que l'API documentée, pas les usages internes des dépendants."
    - id: revue
      kind: revue

`,Pb=`# Exemple D — application local-first avec données utilisateur importantes :
# persistance, migrations et reprise après panne exigent des preuves renforcées.
version: 1
project:
  id: exemple-d-local-first
  name: "Exemple D — Local-first, données critiques"
  description: "Une application locale qui garde les données de l'utilisateur : une perte est inacceptable, les preuves sont renforcées."
workflow:
  id: default
  name: Changement touchant les données
  roles:
    - id: dev
      name: Développeur
      family: dev
    - id: data
      name: Données / migrations
      family: data
    - id: qa
      name: QA
      family: qa
  steps:
    - id: besoin
      kind: besoin
      name: Besoin
      responsibility: "Décrire le changement et dire explicitement s'il touche les données persistées."
      role: dev
      executor: { type: human, name: Mainteneur }
    - id: analyse
      kind: analyse
      name: Analyse des risques données
      responsibility: "Identifier les scénarios de perte : interruption, double exécution, migration partielle, crash."
      role: data
      executor: { type: human, name: Mainteneur }
      riskLevel: critical
      documents:
        - id: doc-data
          title: data-model.md
          purpose: rule
          location: { kind: repo, path: docs/data-model.md }
    - id: impl
      kind: implementation
      name: Implémentation
      responsibility: "Réaliser le changement avec une stratégie de migration réversible quand c'est possible."
      role: dev
      executor: { type: agent, name: Claude, adapterHint: claude, access: read_write }
      riskLevel: critical
    - id: redgreen
      kind: red_green
      name: Preuve Red → Green
      responsibility: "Pour toute correction : reproduire l'échec avant de démontrer le correctif."
      role: qa
      executor: { type: automation, name: Suite de tests }
      evidence:
        - id: ev-rg
          description: Échec reproduit puis corrigé sur le scénario visé
          kind: red_green
          status: not_demonstrated
          limits: "Prouve le scénario testé, pas l'ensemble de la promesse."
    - id: panne
      kind: test
      name: Injection de panne
      responsibility: "Vérifier qu'une interruption pendant l'écriture ne corrompt pas les données existantes."
      role: qa
      executor: { type: automation, name: Suite de tests }
      riskLevel: critical
      evidence:
        - id: ev-panne-avant
          description: Interruption avant écriture
          kind: fault_injection
          status: not_demonstrated
        - id: ev-panne-pendant
          description: Interruption pendant écriture
          kind: fault_injection
          status: not_demonstrated
        - id: ev-reprise
          description: Reprise après crash au démarrage suivant
          kind: fault_injection
          status: not_demonstrated
    - id: revue
      kind: revue
      name: Revue indépendante
      responsibility: "Réfuter la promesse « aucune perte de données » : chercher le scénario manquant."
      role: qa
      executor: { type: agent, name: Checker, access: read_only, independentContext: true }
      authority: { canBlock: true, description: "REFUS obligatoire si un scénario de perte n'est pas couvert." }
    - id: validation
      kind: approbation
      name: Validation humaine
      responsibility: "Accepter le risque résiduel en connaissance de cause avant publication."
      role: dev
      executor: { type: human, name: Mainteneur }
      authority: { canApprove: true, canBlock: true }
  transitions:
    - { id: t1, from: besoin, to: analyse }
    - { id: t2, from: analyse, to: impl }
    - { id: t3, from: impl, to: redgreen }
    - { id: t4, from: redgreen, to: panne }
    - { id: t5, from: panne, to: revue, condition: scénarios de panne verts }
    - { id: t6, from: revue, to: validation, condition: "verdict = PASS" }
    - { id: t7, from: revue, to: impl, label: REFUS, condition: contre-exemple trouvé }
layout:
  positions:
    besoin: { x: 0, y: 60 }
    analyse: { x: 280, y: 60 }
    impl: { x: 580, y: 60 }
    redgreen: { x: 880, y: 60 }
    panne: { x: 1180, y: 60 }
    revue: { x: 880, y: 300 }
    validation: { x: 560, y: 300 }
  paths:
    t5: { from: bottom, to: top }
    t7: { to: top }

      kind: validation
      name: Revue produit
      responsibility: Vérifier que le résultat sert le produit décrit par le CDC, pas seulement qu'il fonctionne.

      executor:
        type: human
        name: Mainteneur
      authority:
        canBlock: true
        canApprove: true

    - id: t1

      from: revue
      to: validation

      from: revue
      to: impl
